<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Text:wght@400;600&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body{% if events_url %} data-events-url="{{ events_url }}"{% endif %}>
    {% if dev_bar is defined %}{{ dev_bar() }}{% endif %}
    {% if admin_bar is defined %}{{ admin_bar() }}{% endif %}
    {% block body %}
    {% endblock %}
    <footer>
        <p><a href="{{ url_for('rules.page') }}">Rules</a> · Visit my <a href="https://iammerlin.fyi" target=_blank>homepage</a>.</p>
    </footer>

    <div class="term-sheet" id="term-sheet" hidden>
        <div class="term-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="term-sheet-title">
            <h3 id="term-sheet-title"></h3>
            <p id="term-sheet-summary"></p>
            <div id="term-sheet-game" class="game-rule-notes" hidden>
                <h4>Changed in this game</h4>
                <ul></ul>
            </div>
            <a id="term-sheet-link" class="term-sheet-more" href="#">Full rules →</a>
        </div>
    </div>
    <script>
    (function () {
        const TERMS = {{ terms_json() }};
        // This viewer's game's rule changes, by rules page ({} if none).
        const GAME_NOTES = {{ game_notes_json(term_ruleset) if term_ruleset else '{}' }};
        const sheet = document.getElementById('term-sheet');
        const title = document.getElementById('term-sheet-title');
        const summary = document.getElementById('term-sheet-summary');
        const more = document.getElementById('term-sheet-link');
        const game = document.getElementById('term-sheet-game');
        const gameList = game.querySelector('ul');

        function open(t, href) {
            title.textContent = t.title;
            title.className = t.team ? 'term-' + t.team : '';
            summary.textContent = t.summary;
            const notes = GAME_NOTES[t.page] || [];
            gameList.innerHTML = notes.map(function (n) { return '<li>' + n + '</li>'; }).join('');
            game.hidden = !notes.length;
            more.href = href;
            sheet.hidden = false;
        }
        function close() { sheet.hidden = true; }

        // Capture phase, so taps on a term never reach other handlers
        // (e.g. the role card's tap-to-hide).
        document.addEventListener('click', function (e) {
            if (e.target.closest('.term-sheet-panel')) return;
            if (!sheet.hidden) {
                close();
                e.preventDefault();
                e.stopPropagation();
                return;
            }
            const a = e.target.closest('a.term');
            // Modifier clicks keep normal link behaviour (open in new tab etc.)
            if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
            const t = TERMS[a.dataset.term];
            if (!t) return;
            e.preventDefault();
            e.stopPropagation();
            open(t, a.getAttribute('href'));
        }, true);
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') close();
        });

        // Outside the rules pages, rules links open in their own tab (one,
        // reused), so the game stays open. Links between rules pages stay put.
        const RULES = /\/rules(\/|$)/;   // also under /admin/as/... (admin viewing as someone)
        if (!RULES.test(location.pathname)) {
            document.addEventListener('click', function (e) {
                const a = e.target.closest('a[href]');
                if (!a || a.target) return;
                const url = new URL(a.href, location.href);
                if (url.origin === location.origin && RULES.test(url.pathname)) {
                    a.target = 'avalon-rules';
                }
            });
        }
    })();
    </script>
    <script src="{{ url_for('static', filename='events.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
