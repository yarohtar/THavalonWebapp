{% extends "template.html" %}
{% block title %}
Registration
{% endblock %}
{% block body %}
<div>
    <h1>Enter Your Name</h1>

    <form method="POST" action="{{ url_for('player.register') }}">
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <input type="text" name="player" placeholder="Your name" value="{{ session.get('name', '') }}" required autofocus>
        <button type="submit">Submit</button>
    </form>
</div>
{% endblock %}
