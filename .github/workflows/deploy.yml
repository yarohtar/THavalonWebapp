name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:  # allows a manual "Run workflow" button on GitHub

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Update app on iammerlin.fyi
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Reached through the Cloudflare tunnel, so the EC2 address can change freely.
          HOST: ssh.iammerlin.fyi
          HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG2sb5DjMuSXBlOnaGPq+IQLiOrSGaM84AvlEWF8S0Jm
          # Cloudflare Access service token; cloudflared reads these automatically.
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$HOST $HOST_KEY" > ~/.ssh/known_hosts
          # The key is restricted on the server to running server-update.sh.
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o ProxyCommand="cloudflared access ssh --hostname %h" \
            ec2-user@"$HOST"
