{% extends "role.html" %}
{% block content %}
{% if not info['seen'] %}
<p>You don't see anyone as evil.</p>
{% else %}
<ul>
    <li>You see the following players as evil:
        <ul>
    {% for player in info['seen'] %}
    <li>
        {{ player }}
    </li>
    {% endfor %}
        </ul>
    </li>
</ul>
{% endif %}
{% endblock %}
