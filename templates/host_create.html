{% extends "template.html" %}
{% block title %}Host a game{% endblock %}
{% block body %}
<div class="card">
    <h1>Host a game</h1>
    <p>Open a lobby for the players to join. You can rename it later.</p>
    <form method="POST" action="{{ url_for('host_create') }}" class="rename-form">
        <input type="text" name="game_name" maxlength="40" value="{{ name }}" aria-label="Game name" required>
        <button type="submit">Create lobby</button>
    </form>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <p><a href="{{ url_for('games') }}">Back to the games</a></p>
</div>
{% endblock %}
