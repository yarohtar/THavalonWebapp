<p>[[Tristan]] and [[Iseult]] are the Lovers.</p>
<ul>
    <li>They know each other.</li>
    <li>Together they are a target of the [[Assassination]]. Evil must name both of them.</li>
</ul>
<p>A lone Lover becomes [[Uther]] in games with 7 or more players. In smaller games they stay a Lover with nobody to love.</p>
